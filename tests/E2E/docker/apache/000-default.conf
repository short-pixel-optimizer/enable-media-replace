# Mounted over /etc/apache2/sites-available/000-default.conf in the E2E
# `wordpress` container: the default vhost serves on both 80 and 8031.
# Everything else (DocumentRoot, AllowOverride for .htaccess, PHP handler)
# comes from the official wordpress image's own configuration.
<VirtualHost *:80 *:8031>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
