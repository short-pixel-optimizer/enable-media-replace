# Browser end-to-end tests (Playwright) against a real served WordPress,
# the same Docker stack bin/test-e2e.sh runs locally (docker-compose.e2e.yml,
# site on http://localhost:8031), so a green run here means a green run on
# any developer machine.
#
# CI runs the Chromium engine only (plus the screenshot regression project
# `visual`, whose baselines are Chromium). Firefox and WebKit are run
# locally for now (bin/test-e2e.sh --project firefox / webkit); a manual
# run from the Actions tab can include them with the `all_engines` input.
# One job per engine, in parallel on separate runners; WebKit, when
# included, reports without gating (see continue-on-error below).
name: E2E (browser)

# Every push to `updates` (the integration branch) or `bulk` (the bulk
# processing work) runs the browser suite, and so does every pull request
# into `updates` or `master`. Other branches are covered by their pull
# request; anything else can be run by hand from the Actions tab
# (workflow_dispatch).
on:
  push:
    branches: [ updates, bulk ]
  pull_request:
    branches: [ updates, master ]
  workflow_dispatch:
    inputs:
      all_engines:
        description: Also run Firefox and WebKit (CI runs Chromium only by default)
        type: boolean
        default: false

# Pull requests: one group per PR, so a newer push cancels the stale run.
# Pushes and manual runs: a unique group per run, so every commit on
# `updates` or `bulk` keeps its own verdict. (A shared group is not enough
# even with cancel-in-progress off: GitHub keeps only ONE pending run per
# group and silently cancels the older pending one when a third arrives.)
concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Playwright / ${{ matrix.engine }} / WP latest
    # Skip pull_request runs whose SOURCE branch is `updates` or `bulk` in
    # this repository: the push to that branch has already tested that exact
    # commit, the PR would only run everything a second time. GitHub reports
    # a job skipped by `if` as passing, so it never blocks the PR.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.ref != 'updates' && github.event.pull_request.head.ref != 'bulk') || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # WebKit reports but does not gate. Playwright's Linux WebKit dies in
    # ways that have nothing to do with the plugin when the runner is
    # starved (2 cores / 7 GB): a web process killed mid-navigation
    # ("WebKit encountered an internal error"). Chromium (and Firefox when
    # included) still gate every run, and a red WebKit job stays visible.
    # This is NOT a retry: the failing test still fails (retries: 0).
    continue-on-error: ${{ matrix.engine == 'webkit' }}

    strategy:
      # Every engine reports its own verdict; one red engine must not hide
      # whether the others are green. The matrix is Chromium only (with the
      # `visual` project) unless a manual run asks for every engine with
      # the all_engines input: `matrix` cannot be read in a job-level `if`,
      # so the list itself is chosen here.
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.all_engines) && '[{"engine":"chromium","projects":"--project chromium --project visual"},{"engine":"firefox","projects":"--project firefox"},{"engine":"webkit","projects":"--project webkit"}]' || '[{"engine":"chromium","projects":"--project chromium --project visual"}]') }}

    steps:
      - uses: actions/checkout@v7

      # Optional: authenticated Docker Hub pulls get a much higher rate
      # limit than the anonymous pool GitHub runners share. Add the two
      # repository secrets and uncomment if pulls ever start failing with
      # 429 / "toomanyrequests" rather than transient resets.
      # - uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Separate step so a registry hiccup is attributable at a glance.
      # Pulls retry with exponential backoff (bin/lib/retry.sh): Docker
      # Hub's token endpoint occasionally resets the connection.
      - name: Pull images (with retry)
        env:
          CI: "1"
        run: bin/test-e2e.sh --pull-only

      - name: Run the E2E suite (${{ matrix.engine }})
        env:
          CI: "1"
          # The EMR site port (SPIO's stack uses 8030). bin/test-e2e.sh
          # defaults to the same value; it is stated here so the job log
          # shows which site the browsers drive.
          SITE_URL: http://localhost:8031
        run: |
          LOG=$(mktemp)
          set +e
          bin/test-e2e.sh ${{ matrix.projects }} 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "!!! Playwright exited with $STATUS"; exit 1
          fi
          # Zero-test guard: a grep or project filter that matches nothing,
          # or a config that finds no spec, can still end with exit 0.
          # Require the Playwright summary line and reject `0 passed`.
          SUMMARY=$(grep -E "^[[:space:]]*[0-9]+ passed" "$LOG" | tail -n 1 || true)
          if [ -z "$SUMMARY" ]; then
            echo "!!! No Playwright summary line (no 'N passed'): no test ran"; exit 1
          fi
          if echo "$SUMMARY" | grep -qE "^[[:space:]]*0 passed"; then
            echo "!!! Playwright reports 0 passed: no test ran"; exit 1
          fi
          echo "=== Playwright: $(echo "$SUMMARY" | sed 's/^[[:space:]]*//')"

      - name: WordPress container logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color wordpress | tail -n 200

      # On a visual failure the report holds expected / actual / diff PNGs.
      - name: Upload Playwright artifacts (traces, screenshots, diffs, report)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-${{ matrix.engine }}
          path: |
            tests/E2E/artifacts/html-report
            tests/E2E/artifacts/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans
